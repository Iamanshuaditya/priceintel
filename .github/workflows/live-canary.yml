name: live-canary
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read
  statuses: write

jobs:
  retailer-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run non-blocking live retailer canary
        id: canary
        run: npm run canary:live
      - name: Upload reliability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priceintel-retailer-reliability-${{ github.sha }}
          path: artifacts/reliability
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish observable live-canary status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.canary.outcome == 'success' && 'success' || 'failure' }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"priceintel/live-canary\",\"description\":\"Non-blocking live retailer measurement: $STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
