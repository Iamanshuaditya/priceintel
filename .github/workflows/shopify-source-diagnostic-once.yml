name: shopify-source-diagnostic-once
on:
  workflow_dispatch:
  push:
    branches:
      - "work/priceintel-foundation"
    paths:
      - ".github/workflows/shopify-source-diagnostic-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  diagnose-shopify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Collect bounded Scindapsus Shopify variant metadata
        id: diagnostic
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/shopify-variant-diagnostic.ts
      - name: Upload source diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priceintel-shopify-source-diagnostic-${{ github.sha }}
          path: artifacts/reliability/shopify-source-diagnostic
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.diagnostic.outcome == 'success' && 'success' || 'failure' }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"priceintel/shopify-source-diagnostic\",\"description\":\"Bounded Shopify source diagnostic: $STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
