name: shopify-corpus-once
on:
  push:
    branches:
      - "work/priceintel-foundation"
    paths:
      - ".github/workflows/shopify-corpus-once.yml"
      - "tests/live-canary/shopify-corpus.json"
      - "tests/live-canary/shopify-manual-truth.json"
      - "packages/crawler-core/src/adapters/shopify.ts"
      - "packages/crawler-core/src/adapters/registry.ts"
      - "packages/crawler-core/test/adapters.test.ts"
      - "packages/crawler-core/test/shopify.test.ts"
      - "packages/crawler-core/src/economics.ts"
      - "packages/crawler-core/test/economics.test.ts"
      - "packages/crawler-core/src/reliability.ts"
      - "packages/crawler-core/test/reliability.test.ts"
      - "scripts/reliability-canary.ts"
      - "scripts/reliability-economics.ts"
      - "package.json"

permissions:
  contents: read
  statuses: write

jobs:
  measure-shopify-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run 20-URL Shopify reliability corpus
        id: corpus
        run: npm run canary:shopify
      - name: Upload Shopify corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priceintel-shopify-corpus-${{ github.sha }}
          path: artifacts/reliability/shopify
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish observable Shopify corpus status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.corpus.outcome == 'success' && 'success' || 'failure' }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"priceintel/shopify-corpus\",\"description\":\"20-URL Shopify reliability measurement: $STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
