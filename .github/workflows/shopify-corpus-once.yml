name: shopify-corpus-once
on:
  workflow_dispatch:
  # Temporary bootstrap only. Delete after the before/after Shopify v1 baseline is recorded.
  push:
    branches:
      - "work/priceintel-foundation"
    paths:
      - ".github/workflows/shopify-corpus-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  measure-shopify-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Score 20-URL Shopify reliability corpus against frozen truth
        id: corpus
        run: npm run canary:shopify
      - name: Upload Shopify corpus report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priceintel-shopify-corpus-${{ github.sha }}
          path: artifacts/reliability/shopify
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish observable Shopify corpus status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.corpus.outcome == 'success' && 'success' || 'failure' }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"priceintel/shopify-corpus\",\"description\":\"Frozen 20-URL Shopify truth score: $STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
