name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "work/**"

permissions:
  contents: read
  statuses: write

jobs:
  persistence-worker:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/priceintel_test
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: priceintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backend hardening gate
        id: backend-tests
        run: |
          npm run typecheck
          npm test
          npm run test:security
          npm run test:vertical
          npm run test:integration
          npm run build
          node dist/scripts/migrate.js
      - name: Install Chromium for browser E2E
        id: browser-install
        run: npx playwright install --with-deps chromium
      - name: Run operator browser E2E
        id: browser-e2e
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priceintel-browser-evidence-${{ github.sha }}
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish observable hardening status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.backend-tests.outcome == 'success' && steps.browser-install.outcome == 'success' && steps.browser-e2e.outcome == 'success' && 'success' || 'failure' }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"priceintel/hardening\",\"description\":\"Backend + browser vertical gate: $STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
