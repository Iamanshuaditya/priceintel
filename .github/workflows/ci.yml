name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "work/**"

permissions:
  contents: read
  statuses: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run foundation gate
        id: foundation-tests
        run: |
          npm test
          npm run test:security
          npm run test:vertical
      - name: Publish foundation commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.foundation-tests.outcome == 'success' && 'success' || 'failure' }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"priceintel/foundation\",\"description\":\"Foundation tests: $STATE\"}"
