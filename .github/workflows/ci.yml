name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:security
      - run: npm run test:vertical
