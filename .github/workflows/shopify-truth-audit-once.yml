name: shopify-truth-audit-once
on:
  workflow_dispatch:
  push:
    branches:
      - "work/priceintel-foundation"
    paths:
      - ".github/workflows/shopify-truth-audit-once.yml"

permissions:
  contents: read
  statuses: write

jobs:
  browser-truth-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Recheck visible Scindapsus 6-inch selector
        id: audit
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/scindapsus-browser-recheck.ts
      - name: Upload browser truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priceintel-scindapsus-browser-recheck-${{ github.sha }}
          path: artifacts/reliability/scindapsus-browser-recheck
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish observable truth-audit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.audit.outcome == 'success' && 'success' || 'failure' }}
        run: |
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"priceintel/shopify-truth-audit\",\"description\":\"Scindapsus visible-variant recheck: $STATE\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
